# Custom fields
baseURL: https://luke.arnoulds.net/
title: 🪴 Fields Far Away
# End custom fields

languageCode: en-us
theme: ["PaperMod"]

sectionPagesMenu: main

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10

    - identifier: categories
      name: Categories
      url: /categories/
      weight: 20

    - identifier: tags
      name: Tags
      url: /tags/
      weight: 25

    - identifier: search
      name: Search
      url: /search/
      weight: 30

caches:
  images:
    dir: :cacheDir/images

params:
  # Custom params
  author: Luke
  og_image: "/images/me.png"
  # End custom params

  env: production
  ShowBreadCrumbs: true
  ShowToc: true
  ShowReadingTime: true
  disableThemeToggle: true
  mainSections:
    - categories
    - posts
  defaultTheme: auto
  ShowFullTextinRSS: true
  ShowSocialIcons: true
  socialIcons:
    - name: "rss"
      url: "index.xml"
  assets:
    theme_color: "#809e88"